<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsere Bucket List</title>
<meta name="description" content="Unsere gemeinsame Bucket List für Dinge, die wir zusammen unternehmen wollen." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" />
<style>
  :root{
    --bg:#EEF1EC;
    --surface:#FFFFFF;
    --surface-2:#E3E8E1;
    --ink:#1C2420;
    --ink-soft:#5C6960;
    --ink-faint:#8A968D;
    --border:#D6DDD2;
    --accent:#2F6F5E;
    --accent-ink:#F4FAF6;
    --accent-soft:#DCEAE3;
    --danger:#B14B34;
    --shadow:rgba(24,32,27,0.10);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --cat-ausflug-rgb:47,111,94;
    --cat-essen-rgb:193,116,58;
    --cat-kultur-rgb:125,90,140;
    --cat-aktiv-rgb:62,127,176;
    --cat-zuhause-rgb:166,124,61;
    --cat-reise-rgb:47,111,138;
    --cat-urlaub-rgb:193,80,112;
    --skyline-rgb:28,36,32;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121815; --surface:#1B2420; --surface-2:#233029; --ink:#E9F0EA;
      --ink-soft:#A6B5AC; --ink-faint:#6D7C73; --border:#2C3931; --accent:#67BC9E;
      --accent-ink:#0C1613; --accent-soft:#233A32; --danger:#E39178; --shadow:rgba(0,0,0,0.45);
      --cat-ausflug-rgb:103,188,158; --cat-essen-rgb:224,158,110; --cat-kultur-rgb:196,164,209;
      --cat-aktiv-rgb:138,184,224; --cat-zuhause-rgb:212,171,110; --cat-reise-rgb:110,178,204; --cat-urlaub-rgb:224,140,160;
      --skyline-rgb:233,240,234;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121815; --surface:#1B2420; --surface-2:#233029; --ink:#E9F0EA;
    --ink-soft:#A6B5AC; --ink-faint:#6D7C73; --border:#2C3931; --accent:#67BC9E;
    --accent-ink:#0C1613; --accent-soft:#233A32; --danger:#E39178; --shadow:rgba(0,0,0,0.45);
    --cat-ausflug-rgb:103,188,158; --cat-essen-rgb:224,158,110; --cat-kultur-rgb:196,164,209;
    --cat-aktiv-rgb:138,184,224; --cat-zuhause-rgb:212,171,110; --cat-reise-rgb:110,178,204; --cat-urlaub-rgb:224,140,160;
    --skyline-rgb:233,240,234;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg); color-scheme:light dark; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    padding:28px 20px 64px;
  }
  .wrap{ max-width:760px; margin:0 auto; }

  h1,h2,h3{ font-family:'Instrument Serif', Georgia, serif; font-weight:400; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font-family:inherit; }

  .skyline{
    margin:0 -20px; padding:0 20px; overflow:hidden; height:84px;
    display:flex; align-items:flex-end;
  }
  .skyline svg{ width:100%; height:72px; display:block; color:rgba(var(--skyline-rgb),0.16); }

  header.top{ padding:6px 0 18px; display:flex; flex-direction:column; gap:12px; }
  .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .title-block h1{ font-size:2.6rem; margin:2px 0 4px; line-height:1.05; }
  .title-block p{ margin:0; color:var(--ink-soft); font-size:0.95rem; max-width:46ch; }

  .progress-row{ display:flex; align-items:center; gap:12px; }
  .progress-track{
    flex:1; height:8px; border-radius:999px; background:var(--surface-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease; }
  .progress-label{ font-size:0.8rem; color:var(--ink-soft); white-space:nowrap; }

  .gate{
    margin-top:14vh; max-width:420px; margin-left:auto; margin-right:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:36px 32px; box-shadow:0 12px 32px var(--shadow); text-align:center;
  }
  .gate .compass{ width:40px; height:40px; margin:0 auto 14px; color:var(--accent); }
  .gate h1{ font-size:1.9rem; margin:0 0 6px; }
  .gate p{ color:var(--ink-soft); margin:0 0 22px; font-size:0.95rem; }
  .gate-input-row{
    display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:6px 6px 6px 16px; margin-bottom:16px;
  }
  #passInput{
    flex:1; border:none; background:transparent; outline:none; font-family:inherit;
    font-size:1rem; color:var(--ink); min-width:0; padding:10px 0;
  }
  #passSubmit{
    background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:calc(var(--radius-md) - 4px); padding:11px 18px;
    font-weight:700; font-size:0.92rem; cursor:pointer; flex:none;
  }
  .gate-error{ font-size:0.82rem; color:var(--danger); margin:-8px 0 14px; min-height:1.1em; }

  .composer{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; display:flex; flex-wrap:wrap; gap:10px; box-shadow:0 6px 18px var(--shadow);
  }
  #itemInput{
    flex:1 1 220px; min-width:0; border:1px solid var(--border); background:var(--bg);
    border-radius:var(--radius-sm); padding:12px 14px; font-family:inherit;
    font-size:0.98rem; color:var(--ink); outline:none;
  }
  #itemInput:focus{ border-color:var(--accent); }
  #categorySelect{
    border:1px solid var(--border); background:var(--bg); border-radius:var(--radius-sm);
    padding:12px 12px; font-family:inherit; font-size:0.92rem; color:var(--ink); flex:0 0 auto;
  }
  #addBtn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-sm);
    padding:0 22px; font-weight:700; font-size:0.95rem; cursor:pointer;
  }
  #addBtn:disabled{ opacity:0.4; cursor:default; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 4px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); border-radius:999px;
    padding:7px 14px 7px 10px; font-size:0.84rem; cursor:pointer; font-weight:600;
  }
  .chip svg{ width:14px; height:14px; }
  .chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .chip.cat-ausflug.active{ background:rgba(var(--cat-ausflug-rgb),0.15); border-color:rgb(var(--cat-ausflug-rgb)); color:rgb(var(--cat-ausflug-rgb)); }
  .chip.cat-essen.active{ background:rgba(var(--cat-essen-rgb),0.15); border-color:rgb(var(--cat-essen-rgb)); color:rgb(var(--cat-essen-rgb)); }
  .chip.cat-kultur.active{ background:rgba(var(--cat-kultur-rgb),0.15); border-color:rgb(var(--cat-kultur-rgb)); color:rgb(var(--cat-kultur-rgb)); }
  .chip.cat-aktiv.active{ background:rgba(var(--cat-aktiv-rgb),0.15); border-color:rgb(var(--cat-aktiv-rgb)); color:rgb(var(--cat-aktiv-rgb)); }
  .chip.cat-zuhause.active{ background:rgba(var(--cat-zuhause-rgb),0.15); border-color:rgb(var(--cat-zuhause-rgb)); color:rgb(var(--cat-zuhause-rgb)); }
  .chip.cat-reise.active{ background:rgba(var(--cat-reise-rgb),0.15); border-color:rgb(var(--cat-reise-rgb)); color:rgb(var(--cat-reise-rgb)); }
  .chip.cat-urlaub.active{ background:rgba(var(--cat-urlaub-rgb),0.15); border-color:rgb(var(--cat-urlaub-rgb)); color:rgb(var(--cat-urlaub-rgb)); }

  .meta-cat.cat-ausflug{ color:rgb(var(--cat-ausflug-rgb)); }
  .meta-cat.cat-essen{ color:rgb(var(--cat-essen-rgb)); }
  .meta-cat.cat-kultur{ color:rgb(var(--cat-kultur-rgb)); }
  .meta-cat.cat-aktiv{ color:rgb(var(--cat-aktiv-rgb)); }
  .meta-cat.cat-zuhause{ color:rgb(var(--cat-zuhause-rgb)); }
  .meta-cat.cat-reise{ color:rgb(var(--cat-reise-rgb)); }
  .meta-cat.cat-urlaub{ color:rgb(var(--cat-urlaub-rgb)); }

  section.list{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }

  .card{
    display:flex; align-items:flex-start; gap:12px; background:var(--surface);
    border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius-md);
    padding:14px 14px 14px 12px; transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{ box-shadow:0 4px 16px var(--shadow); transform:translateY(-1px); }
  .card.cat-ausflug{ border-left-color:rgb(var(--cat-ausflug-rgb)); }
  .card.cat-essen{ border-left-color:rgb(var(--cat-essen-rgb)); }
  .card.cat-kultur{ border-left-color:rgb(var(--cat-kultur-rgb)); }
  .card.cat-aktiv{ border-left-color:rgb(var(--cat-aktiv-rgb)); }
  .card.cat-zuhause{ border-left-color:rgb(var(--cat-zuhause-rgb)); }
  .card.cat-reise{ border-left-color:rgb(var(--cat-reise-rgb)); }
  .card.cat-urlaub{ border-left-color:rgb(var(--cat-urlaub-rgb)); }
  .card.done{ border-left-color:var(--border); }
  .check{
    width:22px; height:22px; border-radius:50%; border:1.6px solid var(--border);
    background:var(--bg); flex:none; cursor:pointer; margin-top:1px;
    display:flex; align-items:center; justify-content:center; color:var(--accent-ink);
  }
  .card.done .check{ background:var(--accent); border-color:var(--accent); }
  .check svg{ width:12px; height:12px; opacity:0; }
  .card.done .check svg{ opacity:1; }

  .card-body{ flex:1; min-width:0; }
  .card-text{ font-size:1rem; line-height:1.4; word-wrap:break-word; }
  .card.done .card-text{ color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--ink-faint); }

  .card-meta{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:8px; font-size:0.78rem; color:var(--ink-faint);
  }
  .meta-cat{ display:inline-flex; align-items:center; gap:5px; }
  .meta-cat svg{ width:13px; height:13px; }

  .card.editing{ flex-direction:column; align-items:stretch; }
  .edit-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .edit-input{
    flex:1 1 200px; min-width:0; border:1px solid var(--border); background:var(--bg);
    border-radius:var(--radius-sm); padding:9px 12px; font-family:inherit;
    font-size:0.96rem; color:var(--ink); outline:none;
  }
  .edit-input:focus{ border-color:var(--accent); }
  .edit-select{
    border:1px solid var(--border); background:var(--bg); border-radius:var(--radius-sm);
    padding:9px 10px; font-family:inherit; font-size:0.88rem; color:var(--ink); flex:0 0 auto;
  }
  .edit-actions{ display:flex; gap:8px; margin-top:10px; }
  .edit-save{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-sm);
    padding:9px 16px; font-weight:700; font-size:0.86rem; cursor:pointer;
  }
  .edit-cancel{
    background:none; color:var(--ink-soft); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 16px; font-size:0.86rem; cursor:pointer;
  }

  .card-actions{ display:flex; align-items:center; gap:4px; flex:none; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-faint);
    padding:6px; border-radius:8px; display:flex;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn.liked{ color:var(--danger); }
  .icon-btn.liked svg{ fill:var(--danger); }

  .tabs{ display:flex; gap:18px; border-bottom:1px solid var(--border); margin-top:26px; }
  .tab{
    background:none; border:none; cursor:pointer; padding:10px 2px 12px;
    margin-bottom:-1px; border-bottom:2px solid transparent;
    color:var(--ink-soft); font-weight:700; font-size:0.94rem;
  }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .tab .count{ color:var(--ink-faint); font-weight:600; margin-left:2px; }
  .tab.active .count{ color:var(--accent); }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty svg{ width:34px; height:34px; color:var(--ink-faint); margin-bottom:10px; }
  .empty p{ margin:0 0 16px; font-size:0.95rem; }
  .suggestions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .suggestion{
    border:1px dashed var(--border); background:var(--surface); color:var(--ink-soft);
    border-radius:999px; padding:7px 14px; font-size:0.82rem; cursor:pointer;
  }
  .suggestion:hover{ border-color:var(--accent); color:var(--accent); }

  .fallback{ margin-top:20vh; text-align:center; color:var(--ink-soft); padding:0 20px; }
  .setup-banner{
    margin-top:40px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:28px 26px; box-shadow:0 12px 32px var(--shadow);
  }
  .setup-banner h1{ font-size:1.6rem; margin:0 0 10px; }
  .setup-banner p{ color:var(--ink-soft); line-height:1.55; }
  .setup-banner code{
    background:var(--surface-2); padding:2px 6px; border-radius:5px;
    font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:0.85em;
  }
  .setup-banner ol{ color:var(--ink-soft); line-height:1.7; padding-left:22px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; }
    .card:hover{ transform:none; }
  }

  @media (max-width:480px){
    .title-block h1{ font-size:1.9rem; }
    .composer{ flex-direction:column; }
    #itemInput{ flex:0 0 auto; width:100%; }
    #categorySelect{ width:100%; }
    #addBtn{ width:100%; padding:12px; }
  }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="fallback" id="loading">Einen Moment …</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var CATEGORIES = [
    { key:'ausflug', label:'Ausflüge', icon:iconCompass(), cls:'cat-ausflug' },
    { key:'essen',   label:'Essen & Trinken', icon:iconCup(), cls:'cat-essen' },
    { key:'kultur',  label:'Kultur', icon:iconTicket(), cls:'cat-kultur' },
    { key:'aktiv',   label:'Aktiv & Sport', icon:iconMountain(), cls:'cat-aktiv' },
    { key:'zuhause', label:'Zuhause', icon:iconHouse(), cls:'cat-zuhause' },
    { key:'reise',   label:'Reisen', icon:iconPlane(), cls:'cat-reise' },
    { key:'urlaub',  label:'Urlaub', icon:iconSuitcase(), cls:'cat-urlaub' },
  ];

  function iconCompass(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.4"/><path d="M12.6 7.4 9.4 9.4 7.4 12.6 10.6 10.6Z" fill="currentColor" stroke="none"/></svg>'; }
  function iconCup(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 6h9v5.2a3.6 3.6 0 0 1-3.6 3.6H8.1A3.6 3.6 0 0 1 4.5 11.2Z"/><path d="M13.5 7.4h1a2 2 0 0 1 0 4h-1"/><path d="M6.5 3.2c-.6.7-.2 1 0 1.6M9 3.2c-.6.7-.2 1 0 1.6"/></svg>'; }
  function iconTicket(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.2a1.8 1.8 0 0 0 0-3.6V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v.6a1.8 1.8 0 0 0 0 3.6v3.6a1.8 1.8 0 0 0 0 3.6V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-.6a1.8 1.8 0 0 0 0-3.6Z"/><path d="M10 3.5v13" stroke-dasharray="1.6 1.6"/></svg>'; }
  function iconMountain(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 15.5 7.8 6.7l2.4 3.6 1.6-2.2 5.7 7.4Z"/><circle cx="6" cy="5.2" r="1.15" fill="currentColor" stroke="none"/></svg>'; }
  function iconHouse(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 9.5 10 4l6.5 5.5"/><path d="M5 8.5V16h10V8.5"/><path d="M8.2 16v-4.2h3.6V16"/></svg>'; }
  function iconPlane(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M17 3 2.5 8.6l5 1.7m9.5-7.3L11.4 17l-1.9-5.1m7.5-8.9-9.9 9.4"/></svg>'; }
  function iconHeart(){ return '<svg viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M10 16.3S3 12.1 3 7.6A3.4 3.4 0 0 1 10 6.4a3.4 3.4 0 0 1 7 1.2c0 4.5-7 8.7-7 8.7Z"/></svg>'; }
  function iconTrash(){ return '<svg viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"><path d="M4.5 6h11M8 6V4.6c0-.6.5-1.1 1.1-1.1h1.8c.6 0 1.1.5 1.1 1.1V6M6 6l.6 9.2c0 .6.5 1 1.1 1h4.6c.6 0 1-.4 1.1-1L14 6"/></svg>'; }
  function iconCheck(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 8 14l7.5-9"/></svg>'; }
  function iconCompassBig(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10" cy="10" r="7.4"/><path d="M12.6 7.4 9.4 9.4 7.4 12.6 10.6 10.6Z" fill="currentColor" stroke="none"/></svg>'; }
  function skylineSvg(){
    return '<svg viewBox="0 0 800 130" preserveAspectRatio="none" fill="currentColor">' +
      '<rect x="0" y="108" width="800" height="2" opacity="0.5"/>' +
      '<rect x="18" y="70" width="26" height="40"/>' +
      '<rect x="54" y="88" width="20" height="22"/>' +
      '<rect x="86" y="60" width="24" height="50"/>' +
      '<polygon points="118,50 150,50 150,110 118,110"/>' +
      '<rect x="132" y="30" width="4" height="20"/>' +
      '<rect x="162" y="76" width="18" height="34"/>' +
      '<polygon points="196,20 214,20 222,110 188,110"/>' +
      '<rect x="236" y="64" width="22" height="46"/>' +
      '<rect x="266" y="84" width="16" height="26"/>' +
      '<polygon points="300,44 300,110 344,110 344,58 322,36"/>' +
      '<rect x="360" y="72" width="20" height="38"/>' +
      '<rect x="392" y="90" width="24" height="20"/>' +
      '<rect x="428" y="66" width="18" height="44"/>' +
      '<rect x="454" y="82" width="20" height="28"/>' +
      '<polygon points="490,54 512,54 512,110 490,110"/>' +
      '<circle cx="501" cy="42" r="7"/>' +
      '<rect x="497" y="20" width="4" height="20"/>' +
      '<rect x="532" y="78" width="22" height="32"/>' +
      '<rect x="564" y="60" width="20" height="50"/>' +
      '<rect x="592" y="88" width="18" height="22"/>' +
      '<polygon points="620,66 646,66 646,110 620,110"/>' +
      '<rect x="631" y="46" width="4" height="20"/>' +
      '<rect x="664" y="82" width="20" height="28"/>' +
      '<rect x="694" y="68" width="24" height="42"/>' +
      '<rect x="728" y="90" width="18" height="20"/>' +
      '<rect x="756" y="76" width="22" height="34"/>' +
    '</svg>';
  }

  function iconSuitcase(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="7" width="14" height="9.5" rx="1.4"/><path d="M7.5 7V5.3c0-.7.6-1.3 1.3-1.3h2.4c.7 0 1.3.6 1.3 1.3V7"/><path d="M3 11h14"/></svg>'; }

  function iconEdit(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12.9 3.9 16.1 7.1 6.5 16.7 3 17.5l.8-3.5Z"/></svg>'; }

  function iconLock(){ return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4.5" y="9" width="11" height="7.5" rx="1.6"/><path d="M6.8 9V6.3a3.2 3.2 0 0 1 6.4 0V9"/><circle cx="10" cy="12.6" r="1.1" fill="currentColor" stroke="none"/></svg>'; }

  function catByKey(k){ for (var i=0;i<CATEGORIES.length;i++) if (CATEGORIES[i].key===k) return CATEGORIES[i]; return CATEGORIES[0]; }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var PASSCODE_LS_KEY = 'abenteuerliste:unlocked';
  var app = document.getElementById('app');
  var db = null;
  var items = [];
  var filter = 'all';
  var activeTab = 'offen';
  var editingId = null;

  function renderSetupNeeded(){
    app.innerHTML =
      '<div class="setup-banner">' +
        '<h1>Fast fertig — Firebase fehlt noch</h1>' +
        '<p>Diese Seite braucht ein kostenloses Firebase-Projekt als Speicher für die gemeinsame Liste. Trage die Projektdaten in <code>firebase-config.js</code> ein (siehe <code>README.md</code> im Repository), dann lädt die Liste automatisch.</p>' +
      '</div>';
  }

  function needsPasscode(){
    var code = window.APP_PASSCODE;
    if (!code || code === 'DEIN_CODEWORT') return false;
    return localStorage.getItem(PASSCODE_LS_KEY) !== '1';
  }

  function renderPasscodeGate(onSuccess){
    app.innerHTML =
      '<div class="skyline" style="margin-top:14vh;">' + skylineSvg() + '</div>' +
      '<div class="gate" style="margin-top:0;">' +
        '<div class="compass">' + iconLock() + '</div>' +
        '<h1>Nur für uns zwei</h1>' +
        '<p>Zum Öffnen bitte das gemeinsame Codewort eingeben.</p>' +
        '<div class="gate-input-row">' +
          '<input id="passInput" type="password" placeholder="Codewort" autocomplete="off" />' +
          '<button id="passSubmit">Öffnen</button>' +
        '</div>' +
        '<div class="gate-error" id="passError"></div>' +
      '</div>';

    var input = document.getElementById('passInput');
    var submit = document.getElementById('passSubmit');
    var error = document.getElementById('passError');

    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
    submit.addEventListener('click', check);
    input.focus();

    function check(){
      var v = input.value.trim().toLowerCase();
      var expected = String(window.APP_PASSCODE || '').trim().toLowerCase();
      if (v && v === expected){
        localStorage.setItem(PASSCODE_LS_KEY, '1');
        onSuccess();
      } else {
        error.textContent = 'Falsches Codewort — nochmal versuchen.';
        input.value = '';
        input.focus();
      }
    }
  }

  function renderFallback(msg){
    app.innerHTML = '<div class="fallback">' + esc(msg) + '</div>';
  }

  function renderApp(){
    var doneCount = items.filter(function(i){ return i.status==='erledigt'; }).length;
    var total = items.length;
    var pct = total ? Math.round(doneCount/total*100) : 0;

    var html = '';
    html += '<div class="skyline">' + skylineSvg() + '</div>';
    html += '<header class="top">';
    html += '  <div class="top-row">';
    html += '    <div class="title-block"><h1>Unsere Bucket List</h1></div>';
    html += '  </div>';
    if (total > 0){
      html += '  <div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="progress-label mono">' + doneCount + ' / ' + total + ' erledigt</div></div>';
    }
    html += '</header>';

    html += '<div class="composer">';
    html += '  <input id="itemInput" type="text" maxlength="140" placeholder="Neue Idee, z. B. „Escape Room ausprobieren“" autocomplete="off" />';
    html += '  <select id="categorySelect">' + CATEGORIES.map(function(c){ return '<option value="' + c.key + '">' + c.label + '</option>'; }).join('') + '</select>';
    html += '  <button id="addBtn">Hinzufügen</button>';
    html += '</div>';

    var openAll = items.filter(function(i){ return i.status !== 'erledigt'; });
    var doneAll = items.filter(function(i){ return i.status === 'erledigt'; });

    html += '<div class="tabs">';
    html += '  <button class="tab' + (activeTab==='offen'?' active':'') + '" data-tab="offen">Offen <span class="count mono">' + openAll.length + '</span></button>';
    html += '  <button class="tab' + (activeTab==='erledigt'?' active':'') + '" data-tab="erledigt">Erledigt <span class="count mono">' + doneAll.length + '</span></button>';
    html += '</div>';

    html += '<div class="filters">';
    html += '  <button class="chip' + (filter==='all'?' active':'') + '" data-filter="all">Alle</button>';
    CATEGORIES.forEach(function(c){
      html += '  <button class="chip ' + c.cls + (filter===c.key?' active':'') + '" data-filter="' + c.key + '">' + c.icon + c.label + '</button>';
    });
    html += '  <button class="chip' + (filter==='favs'?' active':'') + '" data-filter="favs">' + iconHeart() + 'Favoriten</button>';
    html += '</div>';

    var currentList = applyFilter(activeTab === 'offen' ? openAll : doneAll);

    html += '<section class="list">';
    if (total === 0){
      html += emptyState();
    } else if (currentList.length === 0){
      html += '<div class="empty" style="padding:24px 0 4px;"><p>' + (activeTab==='offen' ? 'Keine offenen Ideen in diesem Filter.' : 'Noch nichts erledigt in diesem Filter.') + '</p></div>';
    } else {
      currentList.sort(function(a,b){
        return activeTab === 'offen' ? (a.createdAt||0) - (b.createdAt||0) : (b.createdAt||0) - (a.createdAt||0);
      });
      html += currentList.map(function(i){ return itemCard(i); }).join('');
    }
    html += '</section>';

    app.innerHTML = html;
    wireApp();
  }

  function applyFilter(list){
    if (filter === 'all') return list;
    if (filter === 'favs') return list.filter(function(i){ return i.liked; });
    return list.filter(function(i){ return i.category === filter; });
  }

  function emptyState(){
    var suggestions = ['Neues Restaurant ausprobieren', 'Wochenendtrip planen', 'Escape Room', 'Kochabend zuhause'];
    return '<div class="empty">' + iconCompassBig() + '<p>Noch keine Ideen — tragt eure erste gemeinsame Unternehmung ein.</p>' +
      '<div class="suggestions">' + suggestions.map(function(s){ return '<button class="suggestion" data-suggest="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div></div>';
  }

  function itemCard(i){
    var cat = catByKey(i.category);

    if (i.id === editingId){
      return '' +
        '<div class="card editing ' + cat.cls + '" data-id="' + i.id + '">' +
          '<div class="card-body">' +
            '<div class="edit-row">' +
              '<input class="edit-input" id="editText-' + i.id + '" type="text" maxlength="140" value="' + esc(i.text) + '" />' +
              '<select class="edit-select" id="editCat-' + i.id + '">' +
                CATEGORIES.map(function(c){ return '<option value="' + c.key + '"' + (c.key===i.category?' selected':'') + '>' + c.label + '</option>'; }).join('') +
              '</select>' +
            '</div>' +
            '<div class="edit-actions">' +
              '<button class="edit-save" data-action="save-edit" data-id="' + i.id + '">Speichern</button>' +
              '<button class="edit-cancel" data-action="cancel-edit" data-id="' + i.id + '">Abbrechen</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    return '' +
      '<div class="card ' + cat.cls + (i.status==='erledigt' ? ' done' : '') + '" data-id="' + i.id + '">' +
        '<button class="check" data-action="toggle" data-id="' + i.id + '">' + iconCheck() + '</button>' +
        '<div class="card-body">' +
          '<div class="card-text">' + esc(i.text) + '</div>' +
          '<div class="card-meta">' +
            '<span class="meta-cat ' + cat.cls + '">' + cat.icon + cat.label + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="icon-btn' + (i.liked?' liked':'') + '" data-action="like" data-id="' + i.id + '" title="Favorit">' + iconHeart() + '</button>' +
          '<button class="icon-btn" data-action="edit" data-id="' + i.id + '" title="Bearbeiten">' + iconEdit() + '</button>' +
          '<button class="icon-btn" data-action="delete" data-id="' + i.id + '" title="Löschen">' + iconTrash() + '</button>' +
        '</div>' +
      '</div>';
  }

  function wireApp(){
    var input = document.getElementById('itemInput');
    var select = document.getElementById('categorySelect');
    var addBtn = document.getElementById('addBtn');

    function submit(){
      var text = input.value.trim();
      if (!text || !db) return;
      addBtn.disabled = true;
      db.collection('items').add({
        text: text,
        category: select.value,
        status: 'offen',
        liked: false,
        createdAt: Date.now()
      }).finally(function(){ addBtn.disabled = false; });
      input.value = '';
      input.focus();
    }
    addBtn.addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });

    document.querySelectorAll('[data-filter]').forEach(function(el){
      el.addEventListener('click', function(){ filter = el.getAttribute('data-filter'); renderApp(); });
    });

    document.querySelectorAll('[data-suggest]').forEach(function(el){
      el.addEventListener('click', function(){ input.value = el.getAttribute('data-suggest'); input.focus(); });
    });

    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.addEventListener('click', function(){ activeTab = el.getAttribute('data-tab'); renderApp(); });
    });

    app.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-id');
        var action = el.getAttribute('data-action');
        var item = items.find(function(i){ return i.id === id; });
        if (!item || !db) return;
        var ref = db.collection('items').doc(id);
        if (action === 'toggle'){
          ref.update({ status: item.status === 'erledigt' ? 'offen' : 'erledigt' });
        } else if (action === 'like'){
          ref.update({ liked: !item.liked });
        } else if (action === 'delete'){
          ref.delete();
        } else if (action === 'edit'){
          editingId = id;
          renderApp();
        } else if (action === 'cancel-edit'){
          editingId = null;
          renderApp();
        } else if (action === 'save-edit'){
          var textInput = document.getElementById('editText-' + id);
          var catSelect = document.getElementById('editCat-' + id);
          var newText = textInput ? textInput.value.trim() : '';
          if (!newText) return;
          var newCategory = catSelect ? catSelect.value : item.category;
          item.text = newText;
          item.category = newCategory;
          editingId = null;
          renderApp();
          ref.update({ text: newText, category: newCategory });
        }
      });
    });
  }

  function initApp(){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    db = firebase.firestore();

    renderApp();

    db.collection('items').onSnapshot(function(snap){
      items = snap.docs.map(function(doc){ return Object.assign({ id: doc.id }, doc.data()); });
      renderApp();
    }, function(err){
      renderFallback('Verbindung zur Liste verloren (' + err.code + '). Bitte Seite neu laden.');
    });
  }

  function start(){
    if (!window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey === 'DEIN_API_KEY'){
      renderSetupNeeded();
      return;
    }
    if (needsPasscode()){
      renderPasscodeGate(initApp);
      return;
    }
    initApp();
  }

  start();
})();
</script>
</body>
</html>
